name: trial-uptime

# Probes the public trial every 15 minutes. While it is down, one open issue
# labelled trial-down collects a comment per failed probe; the first good
# probe closes it. Scheduled workflows run only from the default branch.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: trial-uptime
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      URL: https://try.kavachlabs.dev/api/trial/session
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Probe the trial
        id: probe
        run: |
          # Three tries, 20 s apart, so one dropped request is not an outage.
          ok=false
          for i in 1 2 3; do
            code=$(curl -sS -o body.json -w '%{http_code}' --max-time 20 -H 'Accept: application/json' "$URL" 2>curl.err) || code=000
            if [ "$code" = 200 ] && jq -e 'type == "object" and has("limits")' body.json >/dev/null 2>&1; then
              ok=true
              break
            fi
            detail="HTTP $code: $(head -c 300 body.json 2>/dev/null | tr -d '\r' | tr '\n' ' ') $(tr '\n' ' ' <curl.err)"
            echo "try $i: $detail"
            [ "$i" = 3 ] || sleep 20
          done
          echo "ok=$ok" >>"$GITHUB_OUTPUT"
          if [ "$ok" = false ]; then
            {
              echo 'detail<<EOF'
              echo "$detail"
              echo 'EOF'
            } >>"$GITHUB_OUTPUT"
          fi

      - name: Close the trial-down issue
        if: steps.probe.outputs.ok == 'true'
        run: |
          for n in $(gh issue list --label trial-down --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Back up at $(date -u '+%Y-%m-%d %H:%M UTC'): $URL answered 200 with limits ($RUN_URL)."
          done

      - name: Open or comment on the trial-down issue
        if: steps.probe.outputs.ok != 'true'
        env:
          DETAIL: ${{ steps.probe.outputs.detail }}
        run: |
          gh label create trial-down --color B60205 --description "try.kavachlabs.dev failed its uptime probe" 2>/dev/null || true
          now=$(date -u '+%Y-%m-%d %H:%M UTC')
          fence='```'
          body=$(printf '%s: GET %s failed three times.\n\n%s\n%s\n%s\n\n%s\n\nRunbook: bench/agent/deploy/trial/OPERATIONS.md (Incidents).' "$now" "$URL" "$fence" "$DETAIL" "$fence" "$RUN_URL")
          n=$(gh issue list --label trial-down --state open --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
          else
            gh issue create --title "try.kavachlabs.dev is down" --label trial-down --body "$body"
          fi
          exit 1
