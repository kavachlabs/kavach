<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kavach bench</title>
<link rel="icon" type="image/png" href="kavach-icon.png">
<script>
  // The theme a person picked, applied before the first paint.
  try { const t = localStorage.getItem("kavach-bench-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
</script>
<link rel="stylesheet" href="app.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="menu" id="menu" type="button" title="Toggle left sidebar (⌘B)" aria-label="Toggle left sidebar" aria-controls="side">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <rect x="1.5" y="2.5" width="13" height="11" rx="2" stroke="currentColor" stroke-width="1.35"/>
        <line x1="6" y1="2.5" x2="6" y2="13.5" stroke="currentColor" stroke-width="1.35"/>
        <rect class="pane-fill" x="2.5" y="3.5" width="2.5" height="9" rx="0.75" fill="currentColor"/>
      </svg>
    </button>
    <div class="titlewrap">
      <button class="title" id="title" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="nav"><span id="title-text">kavach bench</span><span class="chev" aria-hidden="true">⌄</span></button>
      <nav class="pop" id="nav" hidden></nav>
    </div>
    <div class="right" id="right"></div>
  </header>
  <div class="main" id="main">
    <aside class="side" id="side" aria-label="Runs and tasks"></aside>
    <main class="view" id="view"></main>
  </div>
</div>
</body>
</html>
