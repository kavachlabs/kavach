schema_version = "1.4"

[metadata]
source = "SWE-bench Multilingual tokio-rs__axum-1934"
arm = "control"
description = "axum at the base commit and the bug report."

[agent]
timeout_sec = 2700.0
# No network while the agent works: the OpenCode agent
# (bench/agent/harbor/agents) lets it reach only its model proxy, which
# holds the API key.
network_mode = "no-network"

[environment]
build_timeout_sec = 1800.0
workdir = "/work"

# The verifier runs in its own container (tests/docker-compose.yaml), so the
# hidden test is never in the agent's. All it gets from the agent's container
# is the agent's change, which the collect hook writes before that container
# stops: everything since the commit the agent started from, including
# commits the agent made.
[verifier]
environment_mode = "separate"
timeout_sec = 1200.0
env = { ARM = "control" }

[[verifier.collect]]
user = "root"
command = "cd /work && git -c safe.directory=/work add -A && git -c safe.directory=/work diff --cached --binary $(git -c safe.directory=/work rev-list --max-parents=0 HEAD) > /logs/artifacts/patch.diff"
