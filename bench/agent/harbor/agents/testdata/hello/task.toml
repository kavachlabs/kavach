schema_version = "1.4"

[metadata]
description = "Smoke test for the kavach OpenCode agent: write /app/hello.txt."

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 600.0
# No network while the agent works: main's Compose network is internal and
# shared only with the model proxy service, which holds the API key
# (environment/docker-compose.yaml; bench/agent/harbor/agents/README.md).

[environment]
network_mode = "public"
build_timeout_sec = 600.0
os = "linux"
